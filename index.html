                if (!dest) return;
                const ref = dest[0];
                const pageIndex = typeof ref === "object" ? await pdfDoc.getPageIndex(ref) : ref;
                const target = pageWrappers[pageIndex];
                if (target) target.scrollIntoView({ behavior: "smooth", block: "start" });
              } catch (e) { console.error(e); }
            });
          }
          wrapper.appendChild(overlay);
        }
      } catch (e) { console.error("annotation error on page " + pageNum, e); }
    }

    if (myToken !== renderToken) return;

    // Swap old pages out for the freshly rendered ones in a single step, then
    // restore the scroll position so the view doesn't jump or flicker.
    oldWrappers.forEach((el) => el.remove());
    container.appendChild(fragment);
    if (loading) loading.remove();

    if (anchorIndex >= 0 && pageWrappers[anchorIndex]) {
      const target = pageWrappers[anchorIndex];
      const newY = target.offsetTop + anchorFraction * target.offsetHeight;
      scroller.scrollTop = Math.max(0, newY);
    }
  }

  async function init() {
    const pdfData = base64ToUint8Array(PDF_BASE64);
    pdfDoc = await pdfjsLib.getDocument({ data: pdfData }).promise;
    await renderAllPages();
    window.addEventListener("resize", scheduleRender);
    watchDprChange();
  }

  init().catch((err) => {
    console.error(err);
    const loading = document.getElementById("loading");
    if (loading) loading.remove();
    document.getElementById("error").style.display = "block";
  });
</script>
</body>
</html>
