<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pixel Camera Pro — Documentation</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    background: #525659;
  }
  .bar {
    height: 48px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 1rem;
    background: #323639;
    color: #e8e8e8;
    font-size: 0.95rem;
  }
  .bar a {
    color: #e8e8e8;
    text-decoration: none;
    background: #4a4e51;
    padding: 0.4em 0.9em;
    border-radius: 5px;
    font-size: 0.85rem;
  }
  .bar a:hover { background: #5a5e61; }
  .viewer {
    width: 100%;
    height: calc(100% - 48px);
    border: none;
    display: block;
  }
  .fallback {
    color: #e8e8e8;
    text-align: center;
    padding: 3rem 1rem;
    font-family: Georgia, serif;
  }
</style>
</head>
<body>

<div class="bar">
  <span>Pixel Camera Pro — Documentation</span>
  <a href="Pixel Camera Pro.pdf" download>Download PDF</a>
</div>

<iframe class="viewer" src="Pixel Camera Pro.pdf" title="Pixel Camera Pro documentation">
  <p class="fallback">
    Your browser can't display the PDF inline.
    <a href="Pixel Camera Pro.pdf" style="color:#8ab4f8;">Click here to open it directly.</a>
  </p>
</iframe>

</body>
</html>
