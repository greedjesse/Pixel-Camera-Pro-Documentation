  function base64ToUint8Array(base64) {
    const binary = atob(base64);
    const bytes = new Uint8Array(binary.length);
    for (let i = 0; i < binary.length; i++) {
      bytes[i] = binary.charCodeAt(i);
    }
    return bytes;
  }

  async function renderPDF() {
    const container = document.getElementById("pages");
    const loading = document.getElementById("loading");
    const pdfData = base64ToUint8Array(PDF_BASE64);
    const pdf = await pdfjsLib.getDocument({ data: pdfData }).promise;

    const maxCssWidth = Math.min(900, window.innerWidth - 24);
    const pixelDensity = Math.min(window.devicePixelRatio || 1, 2.5) * 1.4;
    const pageWrappers = [];

    for (let pageNum = 1; pageNum <= pdf.numPages; pageNum++) {
      const page = await pdf.getPage(pageNum);
      const baseViewport = page.getViewport({ scale: 1 });
      const cssScale = maxCssWidth / baseViewport.width;
      const cssViewport = page.getViewport({ scale: cssScale });
      const renderViewport = page.getViewport({ scale: cssScale * pixelDensity });

      const canvas = document.createElement("canvas");
      canvas.className = "page-canvas";
      canvas.width = Math.floor(renderViewport.width);
      canvas.height = Math.floor(renderViewport.height);
      canvas.style.width = Math.floor(cssViewport.width) + "px";
      canvas.style.height = Math.floor(cssViewport.height) + "px";

      const wrapper = document.createElement("div");
      wrapper.className = "page-wrapper";
      wrapper.style.width = Math.floor(cssViewport.width) + "px";
      wrapper.style.height = Math.floor(cssViewport.height) + "px";
      wrapper.appendChild(canvas);
      container.appendChild(wrapper);
      pageWrappers.push(wrapper);

      const ctx = canvas.getContext("2d");
      await page.render({ canvasContext: ctx, viewport: renderViewport }).promise;

      // Wire up internal/external links so the TOC and cross-references are clickable.
      try {
        const annotations = await page.getAnnotations();
        for (const ann of annotations) {
          if (ann.subtype !== "Link") continue;
          const rect = cssViewport.convertToViewportRectangle(ann.rect);
          const x = Math.min(rect[0], rect[2]);
          const y = Math.min(rect[1], rect[3]);
          const w = Math.abs(rect[2] - rect[0]);
          const h = Math.abs(rect[3] - rect[1]);

          const overlay = document.createElement(ann.url ? "a" : "div");
          overlay.className = "link-overlay";
          overlay.style.left = x + "px";
          overlay.style.top = y + "px";
          overlay.style.width = w + "px";
          overlay.style.height = h + "px";
          overlay.style.cursor = "pointer";

          if (ann.url) {
            overlay.href = ann.url;
            overlay.target = "_blank";
            overlay.rel = "noopener";
          } else if (ann.dest) {
            overlay.addEventListener("click", async () => {
              try {
                let dest = ann.dest;
                if (typeof dest === "string") {
                  dest = await pdf.getDestination(dest);
                }
                if (!dest) return;
                const ref = dest[0];
                const pageIndex = typeof ref === "object" ? await pdf.getPageIndex(ref) : ref;
                const target = pageWrappers[pageIndex];
                if (target) target.scrollIntoView({ behavior: "smooth", block: "start" });
              } catch (e) { console.error(e); }
            });
          }
          wrapper.appendChild(overlay);
        }
      } catch (e) {
        console.error("annotation error on page " + pageNum, e);
      }

      if (pageNum === 1) loading.remove();
    }
  }

  renderPDF().catch((err) => {
    console.error(err);
    document.getElementById("loading").remove();
    document.getElementById("error").style.display = "block";
  });
